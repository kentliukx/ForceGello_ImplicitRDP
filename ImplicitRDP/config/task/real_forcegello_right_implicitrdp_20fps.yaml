name: real_forcegello_right_implicitrdp_20fps
dataset_path: ../i2rt/data/forcegello_zarr
image_shape: [3, 240, 320]
control_hz: 20.0
visual_hz: 5.0

shape_meta: &shape_meta
  obs:
    external_img:
      shape: ${task.image_shape}
      type: rgb
      hold_steps: 4
    right_wrist_img:
      shape: ${task.image_shape}
      type: rgb
      hold_steps: 4
    right_robot_joint_pos:
      shape: [7]
      type: low_dim
    right_robot_joint_vel:
      shape: [7]
      type: low_dim
    right_robot_tcp_wrench:
      shape: [6]
      type: low_dim
  extended_obs:
    right_robot_joint_pos:
      shape: [7]
      type: low_dim
    right_robot_joint_vel:
      shape: [7]
      type: low_dim
    right_robot_tcp_wrench:
      shape: [6]
      type: low_dim
  action:
    key: right_robot_command
    space: joint
    shape: [7]

model_shape_meta: *shape_meta

# Used by the workspace's sample metric; no hardware runner is instantiated.
env_runner:
  action_type: joint

dataset:
  _target_: ImplicitRDP.dataset.real_image_tactile_dataset.RealImageTactileDataset
  shape_meta: ${task.shape_meta}
  dataset_path: ${task.dataset_path}
  sample_hz: ${task.control_hz}
  sample_phase: 0
  visual_latency_steps: 1
  horizon: ${horizon}
  pad_before: ${eval:'${dataset_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  obs_temporal_downsample_ratio: 1
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  delta_action: false
  relative_action: false
  rpy_for_rotation: false
